<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>course</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/by_cours.css" />
  </head>
  <body>
    <header>
      <div class="head">
        <h1>welcome in the course (HTML),(CSS)</h1>
        <h3>
          we will present some courses and (html,css) and course links to
          further your learning (html,css)
          <a href="index.html" target="_blank" title="home">BACK HOME</a>
        </h3>
      </div>
    </header>
    <div class="main">
      <div class="html">
        <h1>HTML:</h1>
        <h3>this is way to learn html</h3>
        <button class="a" onclick="modal('ht.html')">enter</button>
      </div>
      <div class="css">
        <h1>CSS:</h1>
        <h3>this is way to learn css</h3>
        <button class="b" onclick="modal('cs.html')">enter</button>
      </div>

      <div class="modal fade" id="myModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-right">

        <div class="modal-content" id="modalContent">
        </div>

    </div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function modal(x) {
        fetch(x)
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("modalContent").innerHTML = data;
            var myModalElement = new bootstrap.Modal(
              document.getElementById("myModal"),
            );
            myModalElement.show();
          })
          .catch((error) => console.log("error", error));
      }
    </script>
  </body>
</html>
