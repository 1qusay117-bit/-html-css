<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">   

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>connect</title>
    <link rel="stylesheet" href="../css/by_connect.css" />
  </head>
  <body>
    <header>
      <div class="main">
        <h1>welcome in connect with us</h1>
        <a href="index.html" target="_blank" title="home">BACK HOME</a>
      </div>
    </header>
    <div class="connect">
      <form id="contactForm" method="post">
        <div class="name">
          <label for="name">name</label>
          <input
          class="name1"
            type="text"
            id="name"
           
            placeholder="ahmed.."
            name="name"
          />
        </div>
        <div class="email">
          <label for="email"> email</label>
          <input
          class="email1"
            type="email"
            id="email"
            
            placeholder="123@gmial...."
            name="email"
          />
        </div>
        <div class="message">
          <label for="message">message</label>
          <textarea
          class="message1"
            id="message"
           
            placeholder="your message"
            name="message" ></textarea>
        </div>
        <div class="enter">
        <button type="submit" id="submitBtn">sent</button>
    </div>  
    </form>
      <div class="social">
        <h1>FOLLOW ELZERO ON SOCIAL MEDIA</h1>
        <a href="https://www.facebook.com/OsElzero" class="facebook" target="_blank"><i class="fa-brands fa-facebook"></i> >>>>>>>>>>>>>> (FACEBOOK)</a>
        <a href="http://www.youtube.com/@ElzeroWebSchool" class="youtube" target="_blank"><i class="fa-brands fa-youtube"></i> >>>>>>>>>>>>>> (YOTUNE)</a>
        <a href="https://www.instagram.com/osama_elzero?igsi=N2luaWV0M2x4Zm5o" class="instagram" target="_blank"><i class="fa-brands fa-instagram"></i> >>>>>>>>>>>>>> (INSTAGEAM)</a>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#contactForm").on("submit", function (e) {
          e.preventDefault(); 

          let name = $("#name").val().trim();
          let email = $("#email").val().trim();
          let message = $("#message").val().trim();
          if (name === "" || email === "" || message === "") {
            toastr.warning("pleas enter values", "warnung");
            return;
          }

          toastr.success(
            "registered successfully" 
          );
          $("#contactForm")[0].reset();
        });
      });
    </script>
  </body>
</html>
